<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 2 - Match it!</title><style>body{font-family:Arial,sans-serif;background:#eef9ff;color:#17324d;margin:0}.wrap{max-width:900px;margin:auto;padding:22px}h1{text-align:center;color:#1769aa}.tabs{text-align:center;margin:12px}.tabs button,#reset{border:0;border-radius:22px;padding:11px 20px;margin:5px;color:white;font-weight:bold;cursor:pointer}.jobs{background:#1687c9}.feel{background:#ef6497}#reset{background:#637083}.status{text-align:center;font-size:18px;font-weight:bold;margin:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.col{display:grid;gap:9px}.card{min-height:58px;border:2px solid #a9d9f2;background:white;border-radius:15px;padding:10px;font-size:16px;font-weight:bold;cursor:pointer}.sel{background:#fff1b8;border-color:#edae18}.ok{background:#dff7df;border-color:#2cb967;color:#176437}.bad{background:#ffdede;border-color:#e34d4d}.finish{display:none;background:#fff2b5;padding:18px;border-radius:16px;text-align:center;margin-top:20px;font-size:20px;font-weight:bold}@media(max-width:550px){.wrap{padding:12px}.grid{gap:9px}.card{font-size:14px;padding:7px}}</style></head><body><div class="wrap"><h1>🔗 Unit 2: Match it!</h1><p style="text-align:center">Klikni na anglické slovo a potom na jeho český význam.</p><div class="tabs"><button class="jobs" id="jobs">💼 JOBS</button><button class="feel" id="feel">😊 FEELINGS</button><button id="reset">↻ Nová hra</button></div><div id="status" class="status"></div><div class="grid"><div><h3 style="text-align:center">ENGLISH 🇬🇧</h3><div id="en" class="col"></div></div><div><h3 style="text-align:center">ČESKY 🇨🇿</h3><div id="cz" class="col"></div></div></div><div id="finish" class="finish">🏆 ⭐ SUPER! Všechno správně! ⭐ 🏆<br><small>Teď zkus každé anglické slovo říct nahlas.</small></div></div><script>(()=>{const sets={jobs:[["artist","umělec / umělkyně"],["acrobat","akrobat / akrobatka"],["dancer","tanečník / tanečnice"],["director","režisér / režisérka"],["reporter","reportér / reportérka"],["cleaner","uklízeč / uklízečka"],["builder","stavitel / stavební dělník"],["secretary","sekretář / sekretářka"]],feel:[["excited","nadšený"],["bored","znuděný"],["afraid","vystrašený"],["proud","pyšný"],["surprised","překvapený"],["angry","naštvaný"],["happy","šťastný"],["sad","smutný"]]};let mode="jobs",chosen=null,done=0,tries=0;const E=document.getElementById("en"),C=document.getElementById("cz"),S=document.getElementById("status"),F=document.getElementById("finish");const sh=a=>[...a].sort(()=>Math.random()-.5);function b(label,key,side){let x=document.createElement("button");x.className="card";x.textContent=label;x.dataset.key=key;x.dataset.side=side;x.onclick=()=>pick(x);return x}function render(){chosen=null;done=tries=0;F.style.display="none";E.innerHTML=C.innerHTML="";sh(sets[mode]).forEach(x=>E.appendChild(b(x[0],x[0],"en")));sh(sets[mode]).forEach(x=>C.appendChild(b(x[1],x[0],"cz")));upd()}function pick(x){if(x.disabled)return;if(!chosen){chosen=x;x.classList.add("sel");S.textContent="Teď najdi dvojici 👀";return}if(chosen.dataset.side===x.dataset.side){chosen.classList.remove("sel");chosen=x;x.classList.add("sel");return}tries++;if(chosen.dataset.key===x.dataset.key){chosen.classList.remove("sel");chosen.classList.add("ok");x.classList.add("ok");chosen.disabled=x.disabled=true;done++;chosen=null;upd();if(done===sets[mode].length){F.style.display="block";S.textContent=`✨ ${done}/${sets[mode].length} správně! Pokusy: ${tries}`}}else{let a=chosen;a.classList.add("bad");x.classList.add("bad");S.textContent="Zkus to ještě jednou 🙂";setTimeout(()=>{a.classList.remove("bad","sel");x.classList.remove("bad")},450);chosen=null}}function upd(){S.textContent=`Správné dvojice: ${done} / ${sets[mode].length}`}document.getElementById("jobs").onclick=()=>{mode="jobs";render()};document.getElementById("feel").onclick=()=>{mode="feel";render()};document.getElementById("reset").onclick=render;render()})();</script></body></html>
